<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 智慧合併工具</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --primary: #8CA395;
            --primary-hover: #768C7E;
            --bg-color: #F4F6F5;
            --surface: #FFFFFF;
            --text-main: #3E4F45;
            --text-muted: #75867D;
            --border-light: #D1DCD6;
            --danger: #D48C8C;
            --danger-hover: #F2DCDC;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(62, 79, 69, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(62, 79, 69, 0.06), 0 2px 4px -1px rgba(62, 79, 69, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(62, 79, 69, 0.08), 0 4px 6px -2px rgba(62, 79, 69, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 1.75rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; }

        #drop-zone {
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            padding: 32px 24px;
            text-align: center;
            background-color: var(--bg-color);
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        #drop-zone:hover, #drop-zone.dragover { border-color: var(--primary); background-color: #E8EFEA; }
        .drop-icon { width: 42px; height: 42px; color: var(--primary); opacity: 0.9; }
        .drop-text { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
        .drop-hint { font-size: 0.85rem; color: var(--text-muted); }
        #file-input { display: none; }

        /* 檔案列表樣式 */
        #file-list {
            list-style: none;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); padding: 12px 16px;
            border: 1px solid var(--border-light); border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm); transition: all 0.2s; cursor: grab;
        }
        .file-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
        .file-item:active { cursor: grabbing; }
        .file-item.dragging { opacity: 0.4; transform: scale(0.98); }
        .file-item.drag-over { border-top: 3px solid var(--primary); }
        
        .file-info { display: flex; align-items: center; gap: 12px; flex-grow: 1; overflow: hidden; }
        .file-index {
            background: var(--bg-color); color: var(--text-main); font-weight: 600;
            font-size: 0.85rem; width: 28px; height: 28px; display: flex;
            align-items: center; justify-content: center; border-radius: 50%;
            flex-shrink: 0; border: 1px solid var(--border-light);
        }
        .file-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        
        .controls { display: flex; gap: 4px; }
        .controls button {
            background: var(--bg-color); color: var(--text-muted); border: 1px solid transparent;
            padding: 6px 8px; border-radius: var(--radius-sm); font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
        }
        .controls button:hover:not(:disabled) { background: #DCE4E0; color: var(--text-main); }
        .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls .btn-remove { color: var(--danger); background: transparent; }
        .controls .btn-remove:hover { background: var(--danger-hover); color: #B56363; }

        /* 檔案設定區塊 */
        .settings-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-color);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }
        .settings-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
        }
        .settings-group input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .settings-group input:focus {
            border-color: var(--primary);
        }

        #merge-btn {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600;
            color: white; background-color: var(--primary); border: none;
            border-radius: var(--radius-md); cursor: pointer; transition: background 0.3s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.5px;
        }
        #merge-btn:hover:not(:disabled) { background-color: var(--primary-hover); }
        #merge-btn:active:not(:disabled) { transform: scale(0.98); }
        #merge-btn:disabled { background-color: #BCC9C1; cursor: not-allowed; }

        #status-container {
            margin-top: 16px; padding: 16px; border-radius: var(--radius-md);
            background: #E8EFEA; border: 1px solid #C5D6CC; color: var(--text-main);
            font-size: 0.9rem; text-align: center; font-weight: 500; display: none;
        }
        #status-container.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📄 智慧 PDF 合併中心</h1>
        </div>

        <div id="drop-zone">
            <svg class="drop-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <span class="drop-text">點擊或拖曳檔案至此區域</span>
            <span class="drop-hint">支援批次上傳，將自動依檔名日期排序</span>
        </div>
        <input type="file" id="file-input" multiple accept="application/pdf">
        
        <ul id="file-list"></ul>
        
        <!-- 新增：預設檔名設定區 -->
        <div class="settings-group">
            <label for="output-filename">預設檔名：</label>
            <input type="text" id="output-filename" value="合併完成_病歷文件" placeholder="請輸入合併後的檔名">
        </div>
        
        <button id="merge-btn" disabled>
            <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            選擇儲存路徑並執行合併
        </button>

        <div id="status-container"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileListElement = document.getElementById('file-list');
        const mergeBtn = document.getElementById('merge-btn');
        const statusContainer = document.getElementById('status-container');
        const outputFilenameInput = document.getElementById('output-filename');
        
        let files = []; 
        let dragStartIndex = null; 

        // --- 解析檔名中的日期 (支援西元與民國) ---
        function extractDateValue(filename) {
            // 匹配西元：20230101, 2023-01-01, 2023_01_01, 2023.01.01
            const gregorianRegex = /(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/;
            const gregorianMatch = filename.match(gregorianRegex);
            if (gregorianMatch) {
                return parseInt(gregorianMatch[1] + gregorianMatch[2] + gregorianMatch[3]); // 轉成如 20230101 的數字
            }

            // 匹配民國：1120101, 112-01-01, 112_01_01
            const minguoRegex = /(1\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/;
            const minguoMatch = filename.match(minguoRegex);
            if (minguoMatch) {
                const year = parseInt(minguoMatch[1]) + 1911; // 轉回西元年做統一比較
                return parseInt(year.toString() + minguoMatch[2] + minguoMatch[3]);
            }

            return null; // 找不到日期
        }

        // --- 檔案匯入與拖曳邏輯 ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });

        function handleFiles(newFiles) {
            const pdfFiles = Array.from(newFiles).filter(file => file.type === 'application/pdf');
            files = [...files, ...pdfFiles];
            
            // 加入檔案後，自動依照檔名內的日期排序 (舊到新)
            files.sort((a, b) => {
                const dateA = extractDateValue(a.name);
                const dateB = extractDateValue(b.name);
                
                if (dateA !== null && dateB !== null) return dateA - dateB; // 都有日期，依日期排
                if (dateA !== null) return -1; // 只有 A 有日期，A 優先
                if (dateB !== null) return 1;  // 只有 B 有日期，B 優先
                return 0; // 都沒日期，保持原位
            });

            renderFileList();
        }

        // --- 渲染列表邏輯 ---
        function renderFileList() {
            fileListElement.innerHTML = '';
            files.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.draggable = true;
                li.dataset.index = index;
                
                li.addEventListener('dragstart', function(e) {
                    dragStartIndex = index;
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', index);
                });
                li.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    document.querySelectorAll('.file-item').forEach(item => item.classList.remove('drag-over'));
                });
                li.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    if (dragStartIndex !== index) this.classList.add('drag-over');
                });
                li.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                li.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    const dragEndIndex = index;
                    if (dragStartIndex !== null && dragStartIndex !== dragEndIndex) {
                        const draggedFile = files.splice(dragStartIndex, 1)[0];
                        files.splice(dragEndIndex, 0, draggedFile);
                        renderFileList();
                    }
                });

                const infoDiv = document.createElement('div');
                infoDiv.className = 'file-info';
                
                const indexSpan = document.createElement('span');
                indexSpan.className = 'file-index';
                indexSpan.textContent = index + 1;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.textContent = file.name;
                nameSpan.title = file.name; 
                
                infoDiv.appendChild(indexSpan);
                infoDiv.appendChild(nameSpan);
                
                const controls = document.createElement('div');
                controls.className = 'controls';
                
                const upBtn = document.createElement('button');
                upBtn.innerHTML = '▲'; upBtn.onclick = () => moveFile(index, -1); upBtn.disabled = index === 0;
                const downBtn = document.createElement('button');
                downBtn.innerHTML = '▼'; downBtn.onclick = () => moveFile(index, 1); downBtn.disabled = index === files.length - 1;
                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '✕'; removeBtn.className = 'btn-remove'; removeBtn.onclick = () => removeFile(index);
                
                controls.appendChild(upBtn); controls.appendChild(downBtn); controls.appendChild(removeBtn);
                li.appendChild(infoDiv); li.appendChild(controls); fileListElement.appendChild(li);
            });

            mergeBtn.disabled = files.length < 2;
        }

        function moveFile(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < files.length) {
                const temp = files[index]; files[index] = files[newIndex]; files[newIndex] = temp; renderFileList();
            }
        }
        function removeFile(index) { files.splice(index, 1); renderFileList(); }

        function updateStatus(message, isActive = true) {
            statusContainer.textContent = message;
            if (isActive) statusContainer.classList.add('active');
            else statusContainer.classList.remove('active');
        }

        // --- 核心：影像化合併與原生存檔 API ---
        mergeBtn.addEventListener('click', async () => {
            if (files.length < 2) return;
            
            let defaultName = outputFilenameInput.value.trim() || '合併完成';
            if (!defaultName.toLowerCase().endsWith('.pdf')) {
                defaultName += '.pdf';
            }

            let fileHandle = null;

            // 1. 先呼叫「另存新檔」視窗要求使用者指定路徑與檔名
            try {
                if (window.showSaveFilePicker) {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: defaultName,
                        types: [{
                            description: 'PDF 檔案',
                            accept: { 'application/pdf': ['.pdf'] },
                        }],
                    });
                }
            } catch (err) {
                // 如果使用者在對話框點擊「取消」，則中斷執行，不浪費時間合併
                if (err.name === 'AbortError') return; 
                console.error('File picker error:', err);
            }

            // 2. 使用者選好路徑後，才開始進行耗時的處理
            mergeBtn.disabled = true;
            updateStatus('🚀 啟動影像轉換引擎，由於進行高畫質處理，可能需要數十秒...');

            try {
                const { PDFDocument, PageSizes } = PDFLib;
                const mergedPdf = await PDFDocument.create();
                const [a4Width, a4Height] = PageSizes.A4;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                        const pdfDoc = await loadingTask.promise;
                        
                        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                            updateStatus(`⚙️ 處理中：檔案 ${i+1}/${files.length} (第 ${pageNum} 頁)...`);
                            const page = await pdfDoc.getPage(pageNum);
                            
                            const scale = 2.0; 
                            const viewport = page.getViewport({ scale: scale });
                            
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            
                            ctx.fillStyle = 'white';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            
                            const renderContext = { canvasContext: ctx, viewport: viewport };
                            await page.render(renderContext).promise;
                            
                            const imgData = canvas.toDataURL('image/jpeg', 0.95);
                            
                            const embeddedImage = await mergedPdf.embedJpg(imgData);
                            const imgWidth = embeddedImage.width;
                            const imgHeight = embeddedImage.height;
                            
                            const newPage = mergedPdf.addPage([a4Width, a4Height]);
                            
                            const fitScale = Math.min(a4Width / imgWidth, a4Height / imgHeight);
                            const scaledWidth = imgWidth * fitScale;
                            const scaledHeight = imgHeight * fitScale;
                            const x = (a4Width - scaledWidth) / 2;
                            const y = (a4Height - scaledHeight) / 2;
                            
                            newPage.drawImage(embeddedImage, { x: x, y: y, width: scaledWidth, height: scaledHeight });
                        }
                    } catch (fileError) {
                        console.error(`檔案 ${file.name} 處理失敗:`, fileError);
                        alert(`【跳過檔案】無法處理「${file.name}」。\n可能受保護或損毀。`);
                    }
                }

                updateStatus('📦 處理完畢，正在寫入檔案...');
                const mergedPdfBytes = await mergedPdf.save();
                
                // 3. 將合併好的資料寫入使用者剛剛指定的路徑
                if (fileHandle) {
                    const writable = await fileHandle.createWritable();
                    await writable.write(mergedPdfBytes);
                    await writable.close();
                } else {
                    // 備用方案：如果瀏覽器太舊不支援 showSaveFilePicker，退回傳統下載模式
                    const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = defaultName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                
                updateStatus('✅ 合併成功！檔案已儲存。');
                setTimeout(() => updateStatus('', false), 4000);

            } catch (error) {
                console.error('嚴重錯誤:', error);
                updateStatus('❌ 發生錯誤，請重試。');
                alert('系統錯誤，詳細資訊已記錄於主控台(F12)。');
            } finally {
                mergeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
