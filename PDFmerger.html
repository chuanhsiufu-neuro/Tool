<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧文件處理中心</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --primary: #8CA395; --primary-hover: #768C7E; --bg-color: #F4F6F5;
            --surface: #FFFFFF; --text-main: #3E4F45; --text-muted: #75867D;
            --border-light: #D1DCD6; --danger: #D48C8C; --radius-lg: 16px;
            --radius-md: 12px; --radius-sm: 8px; --shadow-sm: 0 1px 3px rgba(62, 79, 69, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(62, 79, 69, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; padding: 30px 10px; min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 720px; background: var(--surface);
            padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column; gap: 20px;
        }
        .header { text-align: center; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }

        #drop-zone {
            border: 2px dashed var(--border-light); border-radius: var(--radius-md);
            padding: 35px 24px; text-align: center; background-color: var(--bg-color);
            cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
        }
        #drop-zone:hover { border-color: var(--primary); background-color: #E8EFEA; }
        .drop-text { font-size: 1.05rem; font-weight: 600; }
        .drop-hint { font-size: 0.85rem; color: var(--text-muted); }
        #file-input { display: none; }

        .quick-actions { display: flex; gap: 12px; justify-content: center; margin-top: -5px; }
        .quick-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; background-color: var(--surface); border: 1px solid var(--border-light);
            border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem;
            color: var(--text-main); cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm);
        }
        .quick-btn:hover { border-color: var(--primary); background-color: #E8EFEA; color: var(--primary); }
        .quick-btn svg { width: 20px; height: 20px; color: var(--primary); }

        .shortcut-hint {
            text-align: center; font-size: 0.85rem; color: var(--text-muted); 
            background: #E8EFEA; padding: 10px; border-radius: var(--radius-sm); border: 1px dashed var(--primary);
        }
        kbd {
            background-color: #f7f7f7; border: 1px solid #ccc; border-radius: 4px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2); color: #333; display: inline-block;
            font-size: 0.8rem; font-weight: 700; padding: 2px 6px; margin: 0 2px;
        }

        #file-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); padding: 10px 14px; border: 1px solid var(--border-light);
            border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: grab;
        }
        .file-info { display: flex; align-items: center; gap: 10px; flex-grow: 1; overflow: hidden; }
        .file-type-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: white; flex-shrink: 0; }
        .badge-pdf { background-color: #E74C3C; } .badge-img { background-color: #3498DB; }
        .file-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .controls { display: flex; gap: 4px; }
        .controls button { background: var(--bg-color); color: var(--text-muted); border: none; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; }
        .controls button:hover { background: #DCE4E0; color: var(--text-main); }
        .btn-preview { color: #2980B9 !important; }
        .btn-remove { color: var(--danger) !important; }

        .settings-group {
            display: flex; align-items: center; gap: 12px; padding: 16px;
            background: var(--bg-color); border-radius: var(--radius-md); border: 1px solid var(--border-light);
        }
        .settings-group input { flex-grow: 1; padding: 8px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); outline: none; }

        .btn-main {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600; color: white;
            background-color: var(--primary); border: none; border-radius: var(--radius-md); cursor: pointer;
        }
        .btn-main:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-main:disabled { background-color: #BCC9C1; cursor: not-allowed; }
        #status-container { display: none; padding: 16px; border-radius: var(--radius-md); background: #E8EFEA; text-align: center; font-weight: 500; border: 1px solid var(--primary); color: var(--primary);}
        #status-container.active { display: block; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; display: none; flex-direction: column;
        }
        .modal-overlay.active { display: flex; }
        
        /* 預覽視窗標題列 */
        .preview-header { padding: 12px 20px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .btn-share {
            background-color: #3498DB; color: white; border: none; padding: 8px 14px;
            border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: none; /* 預設隱藏，若瀏覽器支援才顯示 */
        }
        .btn-share:hover { background-color: #2980B9; }
        .btn-close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        
        .preview-content { 
            flex-grow: 1; padding: 10px; display: flex; justify-content: center; align-items: center; overflow: auto; 
        }
        .preview-content iframe { width: 100%; height: 100%; background: white; border-radius: 8px; }
        .preview-content img { 
            max-width: 100%; max-height: 100%; object-fit: contain; background: white; 
            border-radius: 8px; cursor: zoom-in; transition: 0.2s;
        }
        .preview-content img.zoomed { max-width: none; max-height: none; cursor: zoom-out; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>📄 智慧文件處理中心</h1></div>

        <div id="drop-zone">
            <span class="drop-text">點擊或拖曳檔案至此區域匯入</span>
            <span class="drop-hint">支援 .pdf、.jpg、.png (自動依檔名日期排序)</span>
        </div>
        <input type="file" id="file-input" multiple accept="application/pdf, image/jpeg, image/png">
        
        <div class="quick-actions">
            <button class="quick-btn" id="btn-open-camera">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                相機掃描裁切
            </button>
            <button class="quick-btn" id="btn-screen-hint">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                螢幕視窗截圖
            </button>
        </div>

        <div class="shortcut-hint">
            💡 <b>螢幕截取貼上教學：</b><br>
            按下 <kbd>Win</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> 截取畫面後，在此網頁直接按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 即可貼上加入！
        </div>

        <ul id="file-list"></ul>
        
        <div class="settings-group">
            <label>最終檔名：</label>
            <input type="text" id="output-filename" value="合併完成文件">
        </div>
        
        <button class="btn-main" id="merge-btn" disabled>產生 PDF (自動儲存與預覽)</button>
        <div id="status-container"></div>
    </div>

    <!-- 預覽視窗 Modal -->
    <div class="modal-overlay" id="preview-modal">
        <div class="preview-header">
            <h3 id="preview-title">檔案預覽</h3>
            <div class="header-actions">
                <!-- 🌟 手機專用：呼叫原生分享選單存至 Google Drive -->
                <button class="btn-share" id="btn-share-pdf">📤 傳送/存至雲端</button>
                <button class="btn-close-modal" id="btn-close-preview">✕</button>
            </div>
        </div>
        <div class="preview-content" id="preview-content"></div>
    </div>

    <script>
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let added = false;
            
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const d = new Date();
                    const fileName = `截取畫面_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${d.getHours()}${d.getMinutes()}${d.getSeconds()}.jpg`;
                    
                    const newFile = new File([blob], fileName, { type: item.type });
                    files.push(newFile);
                    added = true;
                }
            }
            
            if (added) {
                renderFileList();
                updateStatus('📋 已成功從剪貼簿貼上影像！', true);
                setTimeout(() => updateStatus('', false), 3000);
            }
        });

        let files = []; let previewObjectURL = null;
        let finalMergedPdfFile = null; // 🌟 用來暫存最後合併好的 PDF 檔案給分享按鈕使用
        
        const fileListElement = document.getElementById('file-list');
        const mergeBtn = document.getElementById('merge-btn');
        const btnSharePdf = document.getElementById('btn-share-pdf');

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'ADD_IMAGE') {
                fetch(event.data.data)
                    .then(res => res.blob())
                    .then(blob => {
                        const file = new File([blob], event.data.name, { type: 'image/jpeg' });
                        files.push(file);
                        renderFileList();
                        updateStatus('✅ 已成功接收相機掃描影像！', true);
                        setTimeout(() => updateStatus('', false), 3000);
                    });
            }
        });

        document.getElementById('drop-zone').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

        document.getElementById('btn-screen-hint').addEventListener('click', () => {
            updateStatus('💡 請使用快捷鍵 Win + Shift + S 截圖，然後按 Ctrl + V 貼上！', true);
            setTimeout(() => updateStatus('', false), 4000);
        });

        document.getElementById('btn-open-camera').addEventListener('click', () => {
            const width = 1000;
            const height = 750;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            window.open('scanner.html', 'CameraScanner', `width=${width},height=${height},top=${top},left=${left},toolbar=no,menubar=no,scrollbars=no`);
        });

        function extractDateValue(filename) {
            const gMatch = filename.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
            if (gMatch) return parseInt(gMatch[1] + gMatch[2] + gMatch[3]);
            const mMatch = filename.match(/(1\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
            if (mMatch) return parseInt((parseInt(mMatch[1]) + 1911).toString() + mMatch[2] + mMatch[3]);
            return null;
        }

        function handleFiles(newFiles) {
            const validFiles = Array.from(newFiles).filter(f => ['application/pdf', 'image/jpeg', 'image/png'].includes(f.type));
            files = [...files, ...validFiles];
            files.sort((a, b) => {
                const dA = extractDateValue(a.name), dB = extractDateValue(b.name);
                if (dA !== null && dB !== null) return dA - dB;
                if (dA !== null) return -1; if (dB !== null) return 1; return 0;
            });
            renderFileList();
        }

        function renderFileList() {
            fileListElement.innerHTML = '';
            files.forEach((file, index) => {
                const li = document.createElement('li'); li.className = 'file-item';
                const infoDiv = document.createElement('div'); infoDiv.className = 'file-info';
                const typeBadge = document.createElement('span');
                typeBadge.className = 'file-type-badge ' + (file.type === 'application/pdf' ? 'badge-pdf' : 'badge-img');
                typeBadge.textContent = file.type === 'application/pdf' ? 'PDF' : 'IMG';
                const nameSpan = document.createElement('span'); nameSpan.className = 'file-name'; nameSpan.textContent = file.name;
                infoDiv.append(typeBadge, nameSpan);
                
                const controls = document.createElement('div'); controls.className = 'controls';
                const upBtn = document.createElement('button'); upBtn.innerHTML = '▲'; upBtn.onclick = () => moveFile(index, -1); upBtn.disabled = index === 0;
                const downBtn = document.createElement('button'); downBtn.innerHTML = '▼'; downBtn.onclick = () => moveFile(index, 1); downBtn.disabled = index === files.length - 1;
                const previewBtn = document.createElement('button'); previewBtn.innerHTML = '👁️'; previewBtn.className = 'btn-preview'; previewBtn.onclick = () => openPreview(index);
                const removeBtn = document.createElement('button'); removeBtn.innerHTML = '✕'; removeBtn.className = 'btn-remove'; removeBtn.onclick = () => { files.splice(index, 1); renderFileList(); };
                
                controls.append(upBtn, downBtn, previewBtn, removeBtn);
                li.append(infoDiv, controls); fileListElement.appendChild(li);
            });
            mergeBtn.disabled = files.length === 0;
        }

        function moveFile(idx, dir) { const n = idx + dir; if (n >= 0 && n < files.length) { const t = files[idx]; files[idx] = files[n]; files[n] = t; renderFileList(); } }

        function openPreview(index) {
            const file = files[index]; document.getElementById('preview-title').textContent = file.name;
            const contentDiv = document.getElementById('preview-content'); contentDiv.innerHTML = ''; 
            if (previewObjectURL) URL.revokeObjectURL(previewObjectURL); 
            previewObjectURL = URL.createObjectURL(file);
            
            // 單一檔案預覽時隱藏分享按鈕
            btnSharePdf.style.display = 'none'; 

            if (file.type === 'application/pdf') {
                const iframe = document.createElement('iframe'); iframe.src = previewObjectURL; contentDiv.appendChild(iframe);
            } else {
                const img = document.createElement('img'); img.src = previewObjectURL; 
                img.onclick = () => { img.classList.toggle('zoomed'); }; contentDiv.appendChild(img);
            }
            document.getElementById('preview-modal').classList.add('active');
        }

        document.getElementById('btn-close-preview').addEventListener('click', () => {
            document.getElementById('preview-modal').classList.remove('active');
            document.getElementById('preview-content').innerHTML = '';
        });

        // 🌟 分享按鈕事件 (手機端原生選單)
        btnSharePdf.addEventListener('click', async () => {
            if (!finalMergedPdfFile) return;
            try {
                await navigator.share({
                    files: [finalMergedPdfFile],
                    title: finalMergedPdfFile.name,
                    text: '這是我剛處理好的 PDF 文件'
                });
            } catch (error) {
                console.log('分享取消或不支援', error);
            }
        });

        function updateStatus(msg, active=true) { const c = document.getElementById('status-container'); c.textContent = msg; active ? c.classList.add('active') : c.classList.remove('active'); }
        
        mergeBtn.addEventListener('click', async () => {
            let defaultName = document.getElementById('output-filename').value.trim() || '合併完成';
            if (!defaultName.toLowerCase().endsWith('.pdf')) defaultName += '.pdf';
            let fileHandle = null;
            try { if (window.showSaveFilePicker) fileHandle = await window.showSaveFilePicker({ suggestedName: defaultName, types: [{ description: 'PDF', accept: {'application/pdf': ['.pdf']} }] }); } 
            catch (err) { if (err.name === 'AbortError') return; }

            mergeBtn.disabled = true; updateStatus('啟動轉換引擎...');
            try {
                const { PDFDocument, PageSizes } = PDFLib; const mergedPdf = await PDFDocument.create(); const [a4W, a4H] = PageSizes.A4;
                for (let i = 0; i < files.length; i++) {
                    const file = files[i]; const arrBuf = await file.arrayBuffer();
                    if (file.type === 'application/pdf') {
                        const pdfDoc = await pdfjsLib.getDocument({ data: arrBuf }).promise;
                        for (let p = 1; p <= pdfDoc.numPages; p++) {
                            updateStatus(`處理中：PDF ${i+1}/${files.length} (頁 ${p})...`);
                            const page = await pdfDoc.getPage(p), vp = page.getViewport({scale: 2.0});
                            const cvs = document.createElement('canvas'), ctx = cvs.getContext('2d');
                            cvs.width = vp.width; cvs.height = vp.height; ctx.fillStyle='white'; ctx.fillRect(0,0,cvs.width,cvs.height);
                            await page.render({canvasContext: ctx, viewport: vp}).promise;
                            const img = await mergedPdf.embedJpg(cvs.toDataURL('image/jpeg', 0.95));
                            const newP = mergedPdf.addPage([a4W, a4H]);
                            const fS = Math.min(a4W/img.width, a4H/img.height);
                            newP.drawImage(img, {x: (a4W - img.width*fS)/2, y: (a4H - img.height*fS)/2, width: img.width*fS, height: img.height*fS});
                        }
                    } else {
                        updateStatus(`處理中：圖片 ${i+1}/${files.length}...`);
                        const img = file.type==='image/jpeg' ? await mergedPdf.embedJpg(arrBuf) : await mergedPdf.embedPng(arrBuf);
                        const newP = mergedPdf.addPage([a4W, a4H]);
                        const fS = Math.min(a4W/img.width, a4H/img.height);
                        newP.drawImage(img, {x: (a4W - img.width*fS)/2, y: (a4H - img.height*fS)/2, width: img.width*fS, height: img.height*fS});
                    }
                }
                updateStatus('正在寫入檔案...'); const mergedBytes = await mergedPdf.save();
                
                // 桌機：正常儲存或下載
                if (fileHandle) {
                    const w = await fileHandle.createWritable(); await w.write(mergedBytes); await w.close();
                } else {
                    const u = URL.createObjectURL(new Blob([mergedBytes], {type:'application/pdf'})), a = document.createElement('a');
                    a.href = u; a.download = defaultName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
                }

                // 準備預覽與手機端分享功能
                const blob = new Blob([mergedBytes], { type: 'application/pdf' });
                finalMergedPdfFile = new File([blob], defaultName, { type: 'application/pdf' });

                if (previewObjectURL) URL.revokeObjectURL(previewObjectURL);
                previewObjectURL = URL.createObjectURL(blob);

                document.getElementById('preview-title').textContent = `成果：${defaultName}`;
                
                // 🌟 檢查手機是否支援 Web Share API，若支援則顯示「分享/存至雲端」按鈕
                if (navigator.canShare && navigator.canShare({ files: [finalMergedPdfFile] })) {
                    btnSharePdf.style.display = 'block';
                }

                const contentDiv = document.getElementById('preview-content');
                contentDiv.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.src = previewObjectURL;
                contentDiv.appendChild(iframe);
                document.getElementById('preview-modal').classList.add('active');

                updateStatus('✅ 合併成功！已自動儲存並開啟預覽。'); 
                setTimeout(()=>updateStatus('',false), 3000);
            } catch (err) { 
                console.error(err);
                updateStatus('❌ 發生錯誤，請重試。'); 
            } finally { 
                mergeBtn.disabled = false; 
            }
        });
    </script>
</body>
</html>
